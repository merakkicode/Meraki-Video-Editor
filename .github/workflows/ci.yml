name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl file libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libasound2-plugins libssl-dev librsvg2-dev patchelf libvulkan-dev fonts-dejavu-core nasm yasm libx264-dev libx265-dev libfreetype6-dev libharfbuzz-dev libfontconfig1-dev zlib1g-dev
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Windows media runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-media.ps1
      - name: Linux media runtime
        if: runner.os == 'Linux'
        run: bash scripts/setup-media.sh
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Frontend tests and build
        working-directory: apps/desktop
        run: |
          npm test
          npm run build
      - name: Windows packages
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npm run bundle:windows
      - name: Linux packages
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npm run bundle:linux
      - name: Flatpak payload
        if: runner.os == 'Linux'
        run: bash scripts/flatpak-payload.sh
      - run: node scripts/collect-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: meraki-${{ runner.os }}-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  flatpak:
    needs: desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meraki-Linux-x64
          path: release-assets
      - name: Install Flatpak SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49
      - name: Build and check runtime linkage
        run: |
          flatpak-builder --user --force-clean --repo=packaging/flatpak/repo packaging/flatpak/build packaging/flatpak/org.merakkicode.Meraki.yml
          flatpak build packaging/flatpak/build sh -c 'ldd /app/bin/meraki-desktop.real' > linkage.txt
          cat linkage.txt
          if grep -q 'not found' linkage.txt; then exit 1; fi
          flatpak build-bundle packaging/flatpak/repo release-assets/Meraki.flatpak org.merakkicode.Meraki
      - uses: actions/upload-artifact@v4
        with:
          name: meraki-Flatpak-x64
          path: release-assets/Meraki.flatpak
          if-no-files-found: error
