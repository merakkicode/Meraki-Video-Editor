name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  media:
    name: Media runtime (${{ matrix.target }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: media-cache
        with:
          path: release-assets/media-*.tar.gz
          key: media-ubuntu22-${{ matrix.target }}-${{ hashFiles('scripts/build-media-runtime.sh') }}
      - name: Build dependencies
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake nasm pkg-config gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Build media runtime with corresponding sources
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-media-runtime.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: media-${{ matrix.target }}
          path: release-assets/media-*.tar.gz
          if-no-files-found: error
          retention-days: 14
  desktop:
    needs: media
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl file libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libasound2-plugins libssl-dev librsvg2-dev patchelf libvulkan-dev fonts-dejavu-core xvfb
          sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list
          sudo apt-get update
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: media-${{ matrix.target }}
          path: media-download
      - name: Install Windows media runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/ffmpeg | Out-Null
          tar -xzf media-download/media-runtime-windows.tar.gz -C tools/ffmpeg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tools/ffmpeg/bin/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Linux media runtime
        if: runner.os == 'Linux'
        run: |
          mkdir -p tools/linux/ffmpeg
          tar -xzf media-download/media-runtime-linux.tar.gz -C tools/linux/ffmpeg
          tools/linux/ffmpeg/bin/ffmpeg -version
      - name: Check release metadata
        run: node scripts/check-release.mjs
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Frontend tests and build
        working-directory: apps/desktop
        run: |
          npm test
          npm run build
      - name: Windows installer
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npm run bundle:windows
      - name: Linux AppImage
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npm run bundle:linux
      - run: node scripts/collect-release.mjs
      - name: Retain bundled Linux library sources
        if: runner.os == 'Linux'
        run: bash scripts/collect-linux-sources.sh
      - name: Media encode/decode smoke test
        shell: bash
        run: bash scripts/check-media-runtime.sh '${{ matrix.target }}'
      - name: AppImage startup smoke test
        if: runner.os == 'Linux'
        run: |
          chmod +x release-assets/Meraki.AppImage
          set +e
          timeout 15s xvfb-run -a release-assets/Meraki.AppImage > appimage-startup.log 2>&1
          result=$?
          set -e
          cat appimage-startup.log
          test "$result" = 124
      - uses: actions/upload-artifact@v4
        with:
          name: meraki-${{ runner.os }}-x64
          path: |
            release-assets/Meraki-Setup.exe
            release-assets/Meraki.AppImage
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linux-library-sources
          path: release-assets/linux-library-sources.tar.gz
          if-no-files-found: error
          retention-days: 14
