name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Validate stable version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs
      - name: Assemble release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p publish sources/media sources/linux
          cp artifacts/meraki-Windows-x64/Meraki-Setup.exe publish/
          cp artifacts/meraki-Linux-x64/Meraki.AppImage publish/
          git archive --format=tar.gz --prefix=meraki/ -o sources/meraki-source.tar.gz HEAD
          cp artifacts/media-windows/media-sources-windows.tar.gz sources/media/
          cp artifacts/media-linux/media-sources-linux.tar.gz sources/media/
          cp artifacts/linux-library-sources/linux-library-sources.tar.gz sources/linux/
          cp THIRD_PARTY_NOTICES.md sources/
          printf 'Meraki source revision: %s\nBuild: %s/actions/runs/%s\n' "$GITHUB_SHA" "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > sources/BUILD.txt
          tar -czf "publish/Meraki-$RELEASE_TAG-sources.tar.gz" -C sources .
          (cd publish && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS publish/
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" publish/* --verify-tag --latest --title "Meraki Video Editor $RELEASE_TAG" --notes-file docs/release-notes.md
