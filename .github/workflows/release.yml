name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: meraki-*-x64
          path: release-assets
          merge-multiple: true
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const c=require("./apps/desktop/src-tauri/tauri.conf.json"); if(process.env.RELEASE_TAG.replace(/^v/,"").split("-")[0]!==c.version)process.exit(1)'
      - name: Include corresponding runtime sources
        env:
          SOURCE_URL: ${{ vars.THIRD_PARTY_SOURCE_URL }}
          SOURCE_SHA256: ${{ vars.THIRD_PARTY_SOURCE_SHA256 }}
        run: |
          test -n "$SOURCE_URL" && test -n "$SOURCE_SHA256"
          curl --fail --location --proto '=https' --proto-redir '=https' "$SOURCE_URL" -o release-assets/third-party-sources.tar.gz
          printf '%s  %s\n' "$SOURCE_SHA256" release-assets/third-party-sources.tar.gz | sha256sum --check -
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix=meraki/ -o release-assets/meraki-source.tar.gz HEAD
          (cd release-assets && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS release-assets/
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Meraki Video Editor $RELEASE_TAG" --notes-file docs/release-notes.md "${flags[@]}"
